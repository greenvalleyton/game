<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Green Valley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Russo+One&display=swap">
<style>
/* Layout: phone-first game screen. Painted farm scene on top, sticky wooden resource strip, parchment cards on a grass field, wooden tab plank at the bottom. Single committed look (same in light and dark hosts). */
:root {
  --grass: #5f9b3c;
  --grass-d: #4a8030;
  --wood: #8b5a2b;
  --wood-d: #6b4220;
  --wood-l: #a8743e;
  --parch: #f6e7c4;
  --parch-d: #e8d1a0;
  --ink: #3a2313;
  --muted: #7a5b3e;
  --yellow: #f2b630;
  --yellow-l: #ffd45e;
  --green: #6cc04a;
  --green-d: #4f9b33;
  --red: #e0412f;
  --sky: #c9ecfa;
  --font-display: "Russo One", "Arial Black", Impact, sans-serif;
  --font-body: "Rubik", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--grass);
  background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.6px), radial-gradient(rgba(0,0,0,.06) 1.2px, transparent 1.6px);
  background-size: 18px 18px, 18px 18px; background-position: 0 0, 9px 9px;
  color: var(--ink); font: 15px/1.4 var(--font-body);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow-l); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }
svg { display: block; width: 100%; height: 100%; }
.app { max-width: 540px; margin: 0 auto; padding-inline: 12px; padding-block: 0 100px; display: flex; flex-direction: column; gap: 12px; }

/* Scene */
.scene { position: relative; margin-inline: -12px; height: 168px; overflow: hidden; border-bottom: 4px solid var(--ink); }
.scene .art { position: absolute; inset: 0; }
.scene .art svg { width: 100%; height: 100%; }
.clouds { animation: drift 40s linear infinite alternate; }
@keyframes drift { to { transform: translateX(24px); } }
.scene h1 { position: absolute; left: 14px; top: 12px; margin: 0; font: 26px/1 var(--font-display); color: #fff; letter-spacing: .01em;
  text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 0 6px 0 var(--ink); }
.scene .who { position: absolute; left: 14px; top: 48px; font: 700 12px var(--font-body); color: var(--ink); background: rgba(246,231,196,.92); border: 2px solid var(--ink); border-radius: 99px; padding: 2px 10px; }
.speed { position: absolute; right: 10px; bottom: 34px; display: flex; background: var(--parch); border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 0 3px 0 var(--ink); }
.speed button { background: none; border: 0; padding: 4px 9px; font: 13px var(--font-display); }
.speed button + button { border-left: 2px solid var(--ink); }
.speed button[aria-pressed="true"] { background: var(--yellow); }

/* Wooden resource strip */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-inline: -12px; padding: 8px 12px 10px;
  background: repeating-linear-gradient(180deg, var(--wood) 0 9px, var(--wood-l) 9px 10px, var(--wood) 10px 22px, var(--wood-d) 22px 23px);
  border-bottom: 4px solid var(--ink); display: flex; flex-direction: column; gap: 7px; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.pill { display: flex; align-items: center; gap: 6px; background: var(--parch); border: 3px solid var(--ink); border-radius: 12px; padding: 2px 8px 2px 3px; min-width: 0; }
.pill .i { width: 30px; height: 30px; flex-shrink: 0; }
.pill b { font: 17px/1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.energy { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; }
.ebar { position: relative; height: 26px; background: #2d1a0d; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; }
.ebar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, var(--yellow-l), var(--yellow)); transition: width .3s; }
.ebar span { position: absolute; inset: 0; display: grid; place-items: center; font: 13px var(--font-display); color: #fff; text-shadow: 0 2px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); }
.energy .i { width: 30px; height: 30px; }
.eat { display: flex; gap: 5px; }

/* Buttons */
.btn { border: 3px solid var(--ink); border-radius: 12px; background: var(--parch); padding: 6px 12px; font: 14px var(--font-display); box-shadow: 0 4px 0 var(--ink); transform: translateY(0); transition: transform .05s, box-shadow .05s; white-space: nowrap; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.go { background: var(--yellow); }
.btn.take { background: var(--green); color: #fff; text-shadow: 0 2px 0 var(--ink); }
.btn.red { background: var(--red); color: #fff; text-shadow: 0 2px 0 var(--ink); }
.btn.sm { padding: 3px 8px; font-size: 12px; border-width: 2px; border-radius: 9px; box-shadow: 0 3px 0 var(--ink); }
.btn:disabled { filter: grayscale(.8); opacity: .6; cursor: not-allowed; }
.btn .ico { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; margin-right: 3px; }

/* Wooden sign headings */
.sign { align-self: flex-start; display: flex; align-items: center; gap: 10px; background: repeating-linear-gradient(180deg, var(--wood) 0 8px, var(--wood-l) 8px 9px); border: 3px solid var(--ink); border-radius: 12px; padding: 5px 14px; color: var(--parch); box-shadow: 0 4px 0 var(--ink); margin-top: 6px; }
.sign h2 { margin: 0; font: 17px/1.1 var(--font-display); text-shadow: 0 2px 0 var(--ink); }
.sign small { font: 700 12px var(--font-body); color: var(--parch-d); }
.bar-row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.tip { margin: 0; font-size: 13px; color: #f4f9ec; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.paper { background: var(--parch); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); }
.demo { font-size: 12px; padding: 8px 10px; border-style: dashed; box-shadow: none; }

/* Cards grid */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 359px) { .grid { grid-template-columns: 1fr; } }
.card { padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.window { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border: 3px solid var(--ink); border-radius: 11px; overflow: hidden;
  background: linear-gradient(180deg, var(--sky) 0 62%, #9fd277 62% 100%); display: grid; place-items: center; }
.window.soil { background: linear-gradient(180deg, var(--sky) 0 55%, #8cc56a 55% 100%); }
.window.shop { background: radial-gradient(circle at 50% 45%, #fff6d9 0 35%, #f3d991 70%); }
.window .spr { width: 66%; height: 86%; }
.window .spr.wide { width: 86%; }
.ribbon { position: absolute; left: -3px; top: 8px; font: 10px var(--font-display); letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px 3px 7px; color: #fff; border: 2px solid var(--ink); border-left: 0; border-radius: 0 8px 8px 0; text-shadow: 0 1px 0 var(--ink); }
.t-start { background: #8a7a6a; } .t-common { background: #6a9a4a; } .t-rare { background: #3a6fc4; } .t-epic { background: #8a3fc4; }
.nft { position: absolute; right: 6px; top: 6px; font: 10px var(--font-display); background: var(--yellow); border: 2px solid var(--ink); border-radius: 6px; padding: 1px 5px; }
.card h3 { margin: 0; font: 16px/1.15 var(--font-display); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
.stats span { display: inline-flex; align-items: center; gap: 3px; }
.stats .i { width: 18px; height: 18px; }
.meter { position: relative; height: 16px; background: #d9c08c; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--green); }
.meter.low i { background: var(--red); }
.meter.time i { background: repeating-linear-gradient(-45deg, var(--yellow) 0 6px, var(--yellow-l) 6px 12px); }
.meter span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 11px/1 var(--font-body); color: var(--ink); }
.acts { display: flex; gap: 6px; margin-top: 2px; }
.acts .btn:last-child { flex: 1; }
.sub { font-size: 12px; color: var(--muted); font-weight: 500; }

/* Working tool animation: every tool moves its own way */
.working .spr { animation: swing .7s ease-in-out infinite alternate; transform-origin: 30% 80%; }
@keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(10deg); } }
.tool-axe.working .spr, .tool-oldaxe.working .spr { animation: chop .9s cubic-bezier(.5,0,.2,1) infinite; transform-origin: 25% 85%; }
@keyframes chop { 0% { transform: rotate(-38deg); } 55% { transform: rotate(-38deg); } 70% { transform: rotate(14deg); } 78% { transform: rotate(8deg); } 100% { transform: rotate(-38deg); } }
.tool-saw.working .spr { animation: saw .32s ease-in-out infinite alternate; transform-origin: 50% 50%; }
@keyframes saw { from { transform: translateX(-9%) rotate(-4deg); } to { transform: translateX(9%) rotate(-4deg); } }
.tool-rod.working .spr { animation: cast 2.4s ease-in-out infinite; transform-origin: 20% 90%; }
@keyframes cast { 0%,100% { transform: rotate(-6deg); } 40% { transform: rotate(4deg); } 46% { transform: rotate(-2deg) translateY(3px); } 52% { transform: rotate(5deg); } }
.tool-net.working .spr { animation: sway 1.6s ease-in-out infinite alternate; transform-origin: 50% 10%; }
@keyframes sway { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
.tool-pick.working .spr { animation: strike .75s cubic-bezier(.6,0,.3,1) infinite; transform-origin: 30% 85%; }
@keyframes strike { 0% { transform: rotate(-30deg); } 60% { transform: rotate(-30deg); } 72% { transform: rotate(18deg); } 80% { transform: rotate(12deg); } 100% { transform: rotate(-30deg); } }
.tool-drill.working .spr { animation: drill .09s linear infinite alternate; }
@keyframes drill { from { transform: translate(-1.5px, 1px) rotate(-1deg); } to { transform: translate(1.5px, -1px) rotate(1deg); } }

/* Particles: chips, ripples, sparks */
.fx { position: absolute; inset: 0; pointer-events: none; }
.fx b { position: absolute; left: 58%; top: 62%; width: 7px; height: 5px; border-radius: 2px; background: #c98a3a; border: 1.5px solid var(--ink); opacity: 0; }
.fx b:nth-child(2) { --x: -26px; --y: -30px; animation-delay: .12s !important; }
.fx b:nth-child(3) { --x: 22px; --y: -36px; animation-delay: .24s !important; }
.fx b:nth-child(4) { --x: -12px; --y: -44px; animation-delay: .36s !important; }
.fx b:nth-child(5) { --x: 30px; --y: -20px; animation-delay: .48s !important; }
.fx b { --x: -34px; --y: -18px; }
.tool-axe .fx b, .tool-oldaxe .fx b { animation: chip .9s ease-out infinite; animation-delay: .62s; }
@keyframes chip { 0%,60% { opacity: 0; transform: translate(0,0) rotate(0); } 64% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(200deg); } }
.tool-saw .fx b { width: 4px; height: 4px; border-radius: 50%; background: #e8c48a; border-width: 1px; top: 56%; animation: dust .64s linear infinite; }
@keyframes dust { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(calc(var(--x) * .4), 34px); } }
.tool-rod .fx b, .tool-net .fx b { left: 50%; top: 82%; width: 18px; height: 6px; margin-left: -9px; border-radius: 50%; background: none; border: 2px solid #fff; animation: ripple 2.4s ease-out infinite; }
.tool-rod .fx b:nth-child(n+3), .tool-net .fx b:nth-child(n+3) { display: none; }
.tool-rod .fx b:nth-child(2), .tool-net .fx b:nth-child(2) { animation-delay: 1.2s !important; }
@keyframes ripple { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(3); } }
.tool-pick .fx b, .tool-drill .fx b { width: 5px; height: 5px; border-radius: 50%; background: var(--yellow-l); border: 1px solid #b06a00; box-shadow: 0 0 6px #ffd45e; }
.tool-pick .fx b { animation: spark .75s ease-out infinite; animation-delay: .52s; }
.tool-drill .fx b { animation: spark .45s ease-out infinite; }
@keyframes spark { 0%,40% { opacity: 0; transform: translate(0,0) scale(1); } 45% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.4); } }

/* Rarity you can see */
.window.tier-rare { box-shadow: inset 0 0 0 3px rgba(58,111,196,.55), inset 0 0 18px rgba(58,111,196,.45); }
.window.tier-epic { box-shadow: inset 0 0 0 3px rgba(138,63,196,.6), inset 0 0 22px rgba(138,63,196,.55); }
.window.tier-epic::before { content: ""; position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent 0 70%, rgba(255,255,255,.45) 80%, transparent 90%); animation: shine 4s linear infinite; pointer-events: none; }
@keyframes shine { to { transform: rotate(360deg); } }
.fast { position: absolute; left: 6px; bottom: 6px; font: 10px var(--font-display); background: #fff3c4; border: 2px solid var(--ink); border-radius: 6px; padding: 1px 5px; }

/* Lucky find */
.lucky { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; align-items: center; gap: 0; background: var(--yellow-l); border: 2px solid var(--ink); border-radius: 12px; padding: 2px 7px 3px; font: 18px/1 var(--font-display); box-shadow: 0 3px 0 var(--ink), 0 0 14px #fff6a8; animation: pop .5s ease-out, glow 1s ease-in-out .5s infinite alternate; z-index: 2; }
.lucky small { font: 9px var(--font-display); }
@keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.2); } to { transform: scale(1); } }
@keyframes glow { to { transform: translateY(-3px); box-shadow: 0 6px 0 var(--ink), 0 0 22px #fff6a8; } }

/* Flying resources and counter pulse */
.fly { position: fixed; z-index: 11; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; animation: fly .8s cubic-bezier(.4,0,.6,1) forwards; }
@keyframes fly { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translate(0, var(--arc)) scale(1.1); } 100% { transform: translate(var(--dx), var(--dy)) scale(.55); opacity: .9; } }
.pill.pulse { animation: pulse .35s ease-out; }
@keyframes pulse { 50% { transform: scale(1.12); background: #fff6d0; } }

/* Next goal */
.goal { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
/* Valley Guard promo */
.vg-promo { background: linear-gradient(135deg, #2c4a37, #1d3326); color: #f3ead2; }
.vg-promo .goal-k { background: #c9861c; }
.vg-promo p { margin: 0; font-size: 13px; line-height: 1.35; }
.vg-promo .vg-x { background: none; border: 0; color: inherit; font-size: 16px; padding: 2px 4px; cursor: pointer; opacity: .7; }
.goal-head { display: flex; align-items: center; gap: 8px; }
.goal-head b { flex: 1; font: 15px/1.15 var(--font-display); }
.goal-k { font: 10px var(--font-display); text-transform: uppercase; letter-spacing: .05em; color: #fff; background: var(--green-d); border: 2px solid var(--ink); border-radius: 6px; padding: 2px 6px; }
.goal-row { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: center; }
.goal-row .i { width: 22px; height: 22px; }
.ready-goal { animation: bob 1s ease-in-out infinite alternate; }
.ready .spr { animation: bob 1s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-5px); } }
.ready .window::after { content: "!"; position: absolute; right: 8px; bottom: 6px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--green); color: #fff; font: 16px var(--font-display); border: 2px solid var(--ink); border-radius: 50%; }
.locked .window .spr { opacity: .55; filter: saturate(.5); }

/* Lists in panels */
.panel { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font: 17px var(--font-display); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 500; }
.check b { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font: 12px var(--font-display); color: #fff; }
.check.ok b { background: var(--green); } .check.no b { background: var(--red); }
.field { display: flex; gap: 8px; align-items: center; }
.field input { flex: 1; min-width: 0; font: 18px var(--font-display); padding: 7px 10px; border-radius: 12px; border: 3px solid var(--ink); background: #fffaf0; color: var(--ink); }
.trade { display: grid; grid-template-columns: 48px auto 48px 1fr; align-items: center; gap: 8px; padding: 10px; }
.trade .i { width: 48px; height: 48px; }
.trade .arrow { font: 20px var(--font-display); color: var(--muted); }
.trade .q { font: 15px var(--font-display); }
.trade .btn { justify-self: end; }
.trade .what { display: flex; flex-direction: column; }

/* Tab plank */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding-bottom: env(safe-area-inset-bottom, 0px);
  background: repeating-linear-gradient(180deg, var(--wood) 0 10px, var(--wood-l) 10px 11px, var(--wood) 11px 24px, var(--wood-d) 24px 25px); border-top: 4px solid var(--ink); }
.tabs nav { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px 6px 8px; }
.tabs button { background: none; border: 3px solid transparent; border-radius: 12px; padding: 3px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--parch); font: 11px var(--font-display); text-shadow: 0 2px 0 var(--ink); }
.tabs button .i { width: 32px; height: 32px; transition: transform .15s; }
.tabs button[aria-selected="true"] { background: var(--parch); border-color: var(--ink); color: var(--ink); text-shadow: none; box-shadow: 0 3px 0 var(--ink); }
.tabs button[aria-selected="true"] .i { transform: translateY(-2px) scale(1.08); }

/* Feedback */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--parch); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); padding: 8px 14px; border-radius: 12px; font: 700 14px var(--font-body); max-width: calc(100% - 32px); z-index: 9; text-align: center; }
.toast.bad { background: #ffd9d2; }
.float { position: fixed; z-index: 10; pointer-events: none; display: flex; align-items: center; gap: 4px; font: 20px var(--font-display); color: #fff; text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); animation: rise 1.1s ease-out forwards; }
.float .i { width: 28px; height: 28px; }
@keyframes rise { from { transform: translate(-50%, 0) scale(.8); opacity: 1; } 70% { opacity: 1; } to { transform: translate(-50%, -70px) scale(1.15); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div class="app">
  <section class="scene">
    <div class="art" id="scene"></div>
    <h1>Green Valley</h1>
    <div class="who" id="who">My farm</div>
  </section>

  <header class="hud">
    <div class="pills">
      <div class="pill" title="Wood"><span class="i" data-spr="wood"></span><b id="r-wood">0</b></div>
      <div class="pill" title="Food"><span class="i" data-spr="food"></span><b id="r-food">0</b></div>
      <div class="pill" title="Gold"><span class="i" data-spr="gold"></span><b id="r-gold">0</b></div>
    </div>
    <div class="energy">
      <span class="i" data-spr="bolt"></span>
      <div class="ebar" aria-label="Energy"><i id="r-ebar"></i><span id="r-energy">0 / 500</span></div>
      <div class="eat">
        <button class="btn sm" data-act="eat" data-n="10" title="10 food = 50 energy">+50</button>
        <button class="btn sm go" data-act="eatfull">Eat</button>
      </div>
    </div>
  </header>

  <main id="view" style="display:flex;flex-direction:column;gap:12px"></main>
</div>

<div class="tabs"><nav role="tablist" id="tabs"></nav></div>
<div class="toast" id="toast" hidden></div>

<script>// Original cartoon sprites for Green Valley (SVG, 64x64)
window.SPR = (function () {
  const O = '#3a2313';
  const svg = (inner, vb) => `<svg viewBox="${vb || '0 0 64 64'}" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${inner}</svg>`;
  const S = `stroke="${O}" stroke-width="2.5"`;

  function axe(rusty) {
    const head = rusty ? '#a86b45' : '#c3ced6', hi = rusty ? '#c98a5c' : '#eef3f6';
    const wood = rusty ? '#8e5a2f' : '#c07f43', woodHi = rusty ? '#a8703f' : '#dca064';
    return svg(`<g transform="rotate(35 32 32)">
      <rect x="28.5" y="10" width="7" height="48" rx="3.5" fill="${wood}" ${S}/>
      <rect x="30.5" y="14" width="2" height="38" rx="1" fill="${woodHi}"/>
      <path d="M35 10h7c9 4 10 18 0 24h-7z" fill="${head}" ${S}/>

  // ---------- helpers ----------

    if (ms <= 0) return 'done';

  }
  let tT;

  }
  const memberActive = () => (S.member && S.member.until > now() ? MEMBER[S.member.level] : null);

  const fmtCycle = ms => { const sec = ms / (S.speed || 1) / 1000, m = Math.round(sec / 60); return sec < 60 ? Math.round(sec) + 's' : m >= 60 ? (m % 60 ? (m / 60).toFixed(1) + 'h' : m / 60 + 'h') : m + 'm'; };
  const perHour = d => Math.round(d.yield * H / (d.cycle * H / (S.speed || 1)));
  function toolState(t) {
    const d = TOOLS[t.type];
    if (t.start == null) return { st: 'idle', left: 0, pct: 0 };

  const burn = n => { S.gold -= n; S.stats.goldBurned += n; };

  // ---------- actions (return false to skip re-render) ----------
  const A = {
    tab(el) { S.tab = el.dataset.tab; window.scrollTo(0, 0); },
    eat(el) {
      const n = +el.dataset.n;

    },
    eatfull(el) {
      const need = Math.ceil((500 - S.energy) / 5);
      if (need <= 0) return toast('Energy is already full');
      const n = Math.min(need, Math.floor(S.food));
      if (n <= 0) return toast('Not enough food. Catch some fish with a rod', true);
      S.food -= n; const before = S.energy; S.energy = Math.min(500, S.energy + n * 5); floatAt(el, '+' + Math.round(S.energy - before), 'bolt');
    },
    mine(el) {
      const t = S.tools.find(x => x.uid === el.dataset.id), d = TOOLS[t.type];
      if (t.start != null) return;
      if (d.wear && t.dur < d.wear) return toast('This tool is broken. Repair it first', true);
      if (S.energy < d.energy) return toast('Not enough energy. Tap Eat', true);

    },
    collect(el) {
      const card = el.closest('.card'), from = (card && card.querySelector('.window') || el).getBoundingClientRect();
      const r = collect(S.tools.find(x => x.uid === el.dataset.id), el);

    },
    collectAll(el) {
      const got = { wood: 0, food: 0, gold: 0 }; let n = 0;
      S.tools.forEach(t => { if (toolState(t).st === 'ready') {
        const w = document.querySelector(`[data-prog="${t.uid}"]`), c = w && w.closest('.card'), from = c ? c.querySelector('.window').getBoundingClientRect() : el.getBoundingClientRect();
        const r = collect(t); got[r.res] += r.amt; n++; setTimeout(() => flyTo(from, r.res, r.amt), n * 120);

    },
    lucky(el) {

    goal(el) { S.tab = el.dataset.tab; window.scrollTo(0, 0); },

    buyTool(el) {

    },
    buyMember(el) { const lv = el.dataset.lv; S.member = { level: lv, until: now() + 30 * 24 * H }; S.stats.revenue += MEMBER[lv].price; toast(MEMBER[lv].name + ' membership active for 30 days'); },
    craftBed() {

    },
    plant(el) { const b = S.beds.find(x => x.uid === el.dataset.id); if (S.gold < 5) return toast('Seeds cost 5 gold', true); burn(5); b.planted = true; b.waters = 0; b.last = now(); },
    water(el) { const b = S.beds.find(x => x.uid === el.dataset.id); if (S.energy < 10) return toast('Not enough energy', true); S.energy -= 10; b.waters++; b.last = now(); floatAt(el, 'Watered!'); },
    harvest(el) {
      const b = S.beds.find(x => x.uid === el.dataset.id); S.food += 60; b.planted = false; b.waters = 0; b.last = null; floatAt(el, '+60', 'food');
      if (Math.random() < 0.02) { S.rareSeeds++; toast('Rare seeds! A future NFT'); }
    },
    replant(el) { const b = S.beds.find(x => x.uid === el.dataset.id); b.planted = false; b.waters = 0; b.last = null; },
    coopPay() { if (S.wood < 1500 || S.gold < 300) return toast('You need 1,500 wood and 300 gold', true); S.wood -= 1500; burn(300); S.coop.paid = true; toast('Materials delivered. Start building'); },
    coopStep() { const c = S.coop; if (c.lastStep != null && now() - c.lastStep < 4 * H) return; c.steps++; c.lastStep = now(); toast(c.steps >= 8 ? 'Coop is built!' : 'Build step ' + c.steps + ' of 8'); },
    buyHen() { if (S.hens.length >= 10) return toast('The coop holds up to 10 hens', true); S.hens.push({ uid: uid(), start: null }); S.stats.revenue += HEN_PRICE; toast('A hen moved into the coop'); },
    feed(el) { const h = S.hens.find(x => x.uid === el.dataset.id); if (S.food < 5) return toast('You need 5 food', true); S.food -= 5; h.start = now(); },
    egg(el) {

      if (k === 'sellFood') { if (S.food < 80) return toast('You need 80 food', true); S.food -= 80; S.gold += 9.5; S.stats.goldBurned += 0.5; floatAt(el, '+9.5', 'gold'); }

  // ---------- juice: resources fly from the tool into the counter ----------

  // ---------- views ----------

  function vGarden() {

    const hens = S.hens.map((h, i) => {
      const left = h.start == null ? null : 4 * H - (n - h.start), ready = left != null && left <= 0;
      const btn = h.start == null ? `<button class="btn go" data-act="feed" data-id="${h.uid}">Feed <span class="sub">5</span></button>`
        : ready ? `<button class="btn take" data-act="egg" data-id="${h.uid}">Take egg</button>` : `<button class="btn" disabled>Laying</button>`;
      return `<article class="card paper ${ready ? 'ready' : h.start != null ? 'working' : ''}"><div class="window"><span class="nft">NFT</span><div class="spr">${ready ? SPR.egg() : SPR.hen()}</div></div>
        <h3>Hen ${i + 1}</h3><div class="stats"><span>${ic('food')}+20</span><span class="sub">chick 5%</span></div>
        <div class="meter time"><i style="width:${h.start == null ? 0 : Math.min(100, (n - h.start) / (4 * H) * 100)}%"></i><span>${h.start == null ? 'hungry' : ready ? 'egg ready!' : fmtDur(left)}</span></div>
        <div class="acts">${btn}</div></article>`;
    }).join('');

    return `${sign('Plots', 'rare seeds: ' + S.rareSeeds)}<div class="grid">${beds}${newBed}</div>
      <p class="tip">Water every ${fmtCycle(4 * H)}. Skip more than ${fmtCycle(8 * H)} and the crop withers.</p>
      ${sign('Chicken Coop')}<div class="grid">${coop}${hens}</div>`;
  }

  function vShop() {
    const tools = Object.entries(TOOLS).filter(([, d]) => d.nft).map(([k, d]) => `<article class="card paper">
      <div class="window shop"><span class="ribbon ${d.tc}">${d.tier}</span><span class="nft">NFT</span><div class="spr">${spr(k)}</div></div>
      <h3>${d.name}</h3><div class="stats"><span>${ic(d.res)}+${d.yield}<span class="sub">/${fmtCycle(d.cycle * H)}</span></span><span>${ic('bolt')}${d.energy}</span></div>
      <div class="stats sub">≈${perHour(d)} ${RES_NAME[d.res]} per hour · durability ${d.dur}</div>
      <div class="acts"><button class="btn go" data-act="buyTool" data-type="${k}">$${d.price}</button></div></article>`).join('');
    const m = memberActive();
    const mem = Object.entries(MEMBER).map(([k, d]) => {
      const mine = m && S.member.level === k;
      return `<article class="card paper"><div class="window shop"><span class="ribbon t-start">30 days</span><div class="spr">${SPR[d.spr]()}</div></div>
      <h3>${d.name}</h3><div class="stats"><span>+${d.bonus * 100}% yield</span></div><div class="stats sub">${d.slots} slots · withdrawal fee −${d.fee} pp</div>
      <div class="acts"><button class="btn ${mine ? '' : 'go'}" data-act="buyMember" data-lv="${k}">${mine ? 'Extend' : '$' + d.price}</button></div></article>`;
    }).join('');
    return `<div class="paper demo">Test purchases: nothing is charged, the total goes to the revenue counter on the Withdraw tab. In the live game you pay in GRAM or Telegram Stars.</div>
      ${sign('Tools', 'free slots: ' + Math.max(0, slots() - S.tools.length))}<div class="grid">${tools}</div>
      ${sign('Membership', m ? m.name + ', ' + fmtDur(S.member.until - now()) + ' left' : 'none')}<div class="grid">${mem}</div>`;
  }

  function vMarket() {
    const deal = (kind, a, qa, b, qb) => `<div class="paper trade">${ic(a)}<div class="what"><span class="q">${qa}</span></div>${ic(b)}<div class="what"><span class="q">${qb}</span><button class="btn go sm" data-act="trade" data-kind="${kind}">Trade</button></div></div>`;
    return `<div class="paper demo">Market simulation: in the live game other players post the orders; here prices are fixed. The 5% fee is burned.</div>
      ${sign('Sell')}${deal('sellWood', 'wood', '100 →', 'gold', '9.5')}${deal('sellFood', 'food', '80 →', 'gold', '9.5')}
      ${sign('Buy')}${deal('buyFood', 'gold', '10 →', 'food', '76')}${deal('buyWood', 'gold', '10 →', 'wood', '95')}`;
  }

  function vOut() {
    const m = memberActive(), fee = Math.max(3, 10 - (m ? m.fee : 0));
    const hasNft = S.tools.some(t => TOOLS[t.type].nft);
    const R = S.stats.goldMined ? S.stats.goldBurned / S.stats.goldMined : 0;
    const inp = document.getElementById('w-amt');
    const amt = inp ? Math.max(0, +inp.value || 0) : Math.floor(S.gold), f = amt * fee / 100;
    const chk = (ok, txt, extra) => `<div class="check ${ok ? 'ok' : 'no'}"><b>${ok ? '✓' : '×'}</b><span>${txt}</span>${extra || ''}</div>`;
    return `${sign('Withdraw gold', '1 GOLD = 1 $GLD')}
      <div class="paper panel">
        <div class="field"><span class="i" style="width:40px;height:40px">${SPR.gold()}</span><input id="w-amt" type="number" inputmode="decimal" min="0" step="1" value="${amt}" aria-label="Gold to withdraw"><button class="btn sm" data-act="max">Max</button></div>
        <dl class="kv">
          <dt>Fee${m ? ' (membership discount)' : ''}</dt><dd>${fee}% · ${fmtN(f)}</dd>
          <dt>Burned / to reserve</dt><dd>${fmtN(f / 2)} / ${fmtN(f / 2)}</dd>
          <dt>You receive</dt><dd style="font-size:17px">${fmtN(amt - f)} $GLD</dd>
        </dl>
        ${chk(amt >= 500 && amt <= 5000, '500 to 5,000 gold per day')}
        ${chk(amt <= S.gold, 'Enough gold: ' + fmtN(S.gold))}
        ${chk(hasNft, 'Owns a purchased NFT tool')}
        ${chk(S.wallet, 'TON wallet connected', `<button class="btn sm" data-act="wallet" style="margin-left:auto"><span class="ico">${SPR.wallet()}</span>${S.wallet ? 'Disconnect' : 'Connect'}</button>`)}
        ${chk(false, 'Account is at least 14 days old')}
        <button class="btn" disabled>Withdrawals open after the token launch</button>
      </div>
      ${sign('Farm economy', 'target R ≥ 0.6')}
      <div class="paper panel"><dl class="kv">
        <dt>Gold mined</dt><dd>${fmtN(S.stats.goldMined)}</dd>
        <dt>Gold burned</dt><dd>${fmtN(S.stats.goldBurned)}</dd>
        <dt>R = burned / mined</dt><dd style="color:${R >= 0.6 ? 'var(--green-d)' : 'var(--red)'}">${S.stats.goldMined ? R.toFixed(2) : '—'}</dd>
        <dt>Yield multiplier k</dt><dd>${K.toFixed(2)}</dd>
        <dt>Test revenue</dt><dd>$${fmtN(S.stats.revenue)}</dd>
        <dt>To payout reserve (40%)</dt><dd>$${fmtN(S.stats.revenue * 0.4)}</dd>
      </dl></div>
      <button class="btn red" data-act="reset" style="align-self:center">Start over</button>`;
  }
  const VIEWS = { farm: vFarm, garden: vGarden, shop: vShop, market: vMarket, out: vOut };

  // ---------- render ----------
  document.getElementById('scene').innerHTML = SPR.scene();
  document.querySelector('#scene svg').setAttribute('preserveAspectRatio', 'xMidYMax slice');
  document.querySelectorAll('[data-spr]').forEach(el => { el.innerHTML = spr(el.dataset.spr); });

  function renderHud() {
    document.getElementById('r-wood').textContent = fmtN(S.wood);
    document.getElementById('r-food').textContent = fmtN(S.food);
    document.getElementById('r-gold').textContent = fmtN(S.gold);
    document.getElementById('r-energy').textContent = Math.floor(S.energy) + ' / 500';
    document.getElementById('r-ebar').style.width = S.energy / 5 + '%';
    document.getElementById('tabs').innerHTML = TABS.map(([k, n, s]) => `<button role="tab" data-act="tab" data-tab="${k}" aria-selected="${S.tab === k}">${ic(s)}<span>${n}</span></button>`).join('');
  }
  let sig = '';
  function signature() {
    const n = now();
    return S.tab + '|' + (lucky ? lucky.uid : '') + '|' + S.tools.map(t => toolState(t).st).join('') + '|' + S.beds.length + '|' +
      S.beds.map(b => b.planted ? Math.floor((n - b.last) / (4 * H)) + ':' + b.waters : 'e').join(',') + '|' +
      (S.coop.lastStep == null ? 0 : Math.min(1, Math.floor((n - S.coop.lastStep) / (4 * H)))) + '|' +
      S.hens.map(h => h.start == null ? 'h' : n - h.start >= 4 * H ? 'r' : 'w').join('');
  }
  function render() { renderHud(); document.getElementById('view').innerHTML = VIEWS[S.tab](); sig = signature(); save(); }
  function tick() {
    luckyTick();
    if (signature() !== sig) { const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    S.tools.forEach(t => {
      const s = toolState(t); if (s.st !== 'work') return;
      const p = document.querySelector(`[data-prog="${t.uid}"]`); if (p) p.style.width = s.pct + '%';
      const l = document.querySelector(`[data-left="${t.uid}"]`); if (l) l.textContent = fmtDur(s.left);
    });
    if (S.tab === 'garden' && !(document.activeElement && document.activeElement.matches('input'))) {
      // garden timers: refresh labels and bars only
      const tmp = document.createElement('div'); tmp.innerHTML = vGarden();
      const fresh = tmp.querySelectorAll('.meter'), cur = document.querySelectorAll('#view .meter');
      if (fresh.length === cur.length) cur.forEach((m, i) => { m.innerHTML = fresh[i].innerHTML; });
      const fb = tmp.querySelectorAll('.acts'), cb = document.querySelectorAll('#view .acts');
      if (fb.length === cb.length) cb.forEach((m, i) => { if (m.innerHTML !== fb[i].innerHTML) m.innerHTML = fb[i].innerHTML; });
    }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const act = el.dataset.act;
    const r = A[act] && A[act](el);
    if (r === false) return;
    const y = window.scrollY; render(); if (act !== 'tab') window.scrollTo(0, y);
  });
  document.addEventListener('input', e => {
    if (e.target.id !== 'w-amt') return;
    render(); const i = document.getElementById('w-amt'); i.focus(); const v = i.value; i.value = ''; i.value = v;
  });

  render();
  cloudLoad();
  setInterval(tick, 500);
  setInterval(save, 5000);
})();
</script>

</body>
</html>
